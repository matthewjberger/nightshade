[package]
name = "dag-check"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing"] }
toml = { workspace = true }

[[bin]]
name = "dag-check"
path = "src/main.rs"
