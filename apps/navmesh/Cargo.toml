[package]
name = "navmesh"
description = "Navigation mesh pathfinding with A* search, funnel smoothing, and agent avoidance"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
edition = "2024"
license.workspace = true
publish = false

[dependencies]
nightshade = { workspace = true, features = ["tracing", "navmesh-bake", "physics"] }
nalgebra-glm = { workspace = true }
noise = { workspace = true }
rand = "0.9"
serde = { workspace = true }
