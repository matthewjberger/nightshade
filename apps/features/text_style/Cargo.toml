[package]
name = "text_style"
description = "Text drawn from a distance field, with its outline and its edge on sliders"
version.workspace = true
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "text_style-run"
path = "src/main.rs"

[dependencies]
nightshade-app = { path = "../../../crates/plugins/draw/nightshade-app", default-features = false }
nightshade.workspace = true
nightshade-cli.workspace = true
nightshade-camera.workspace = true
nightshade-camera-controller.workspace = true
nightshade-graphics.workspace = true
nightshade-log.workspace = true
nightshade-platform.workspace = true
nightshade-scene.workspace = true
nightshade-text.workspace = true
nightshade-ui.workspace = true
nightshade-window.workspace = true

[features]
default = ["wgpu"]
wgpu = ["nightshade-app/wgpu"]
vulkan = ["nightshade-app/vulkan"]
