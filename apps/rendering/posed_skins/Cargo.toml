[package]
name = "posed_skins"
description = "The device poses a skin, and the sun traces its shadow against that pose"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "posed_skins-run"
path = "src/main.rs"

[dependencies]
nightshade-readout = { path = "../../../crates/framework/interface/nightshade-readout" }
nightshade-app = { path = "../../../crates/plugins/draw/nightshade-app", default-features = false }
nightshade.workspace = true
nightshade-cli.workspace = true
nightshade-animation.workspace = true
nightshade-camera.workspace = true
nightshade-camera-controller.workspace = true
nightshade-graphics.workspace = true
nightshade-log.workspace = true
nightshade-platform.workspace = true
nightshade-load = { workspace = true, features = ["fetch"] }
nightshade-gltf = { workspace = true, features = ["fetch"] }
nightshade-prefab = { workspace = true }
nightshade-render.workspace = true
nightshade-window.workspace = true
nalgebra-glm.workspace = true
tracing = { workspace = true }

[features]
default = ["wgpu"]
vulkan = ["nightshade-app/vulkan"]
wgpu = ["nightshade-app/wgpu"]
