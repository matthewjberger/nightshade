[package]
name = "hollowmere"
description = "An offline fantasy MMO on a block world, where every other player on the road is a simulation"
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "hollowmere-run"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
nightshade-random = { workspace = true }
nightshade-app = { path = "../../../crates/plugins/draw/nightshade-app" }
