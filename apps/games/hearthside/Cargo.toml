[package]
name = "hearthside"
description = "A small-house life sim where furniture feeds the needs of the person who lives there"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "hearthside-run"
path = "src/main.rs"
required-features = ["plugin"]

[dependencies]
nightshade-app = { path = "../../../crates/plugins/draw/nightshade-app", optional = true }
nalgebra-glm = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
nightshade = { workspace = true, optional = true }
nightshade-animation = { workspace = true, optional = true }
nightshade-camera = { workspace = true, optional = true }
nightshade-camera-controller = { workspace = true, optional = true }
nightshade-cli = { workspace = true, optional = true }
nightshade-load = { workspace = true }
nightshade-gltf = { workspace = true, optional = true }
nightshade-graphics = { workspace = true, optional = true }
nightshade-input = { workspace = true, optional = true }
nightshade-log = { workspace = true, optional = true }
nightshade-picking = { workspace = true, optional = true }
nightshade-platform = { workspace = true, optional = true }
nightshade-prefab = { workspace = true, optional = true }
nightshade-render = { workspace = true, optional = true }
nightshade-scene = { workspace = true, optional = true }
nightshade-shell = { workspace = true, optional = true }
nightshade-text = { workspace = true, optional = true }
nightshade-ui = { workspace = true, optional = true }
nightshade-window = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["plugin"]
contract = []
plugin = [
    "dep:nightshade-app",
    "contract",
    "dep:nalgebra-glm",
    "dep:petgraph",
    "dep:nightshade",
    "dep:nightshade-animation",
    "dep:nightshade-camera",
    "dep:nightshade-camera-controller",
    "dep:nightshade-cli",
    "dep:nightshade-gltf",
    "dep:nightshade-graphics",
    "dep:nightshade-input",
    "dep:nightshade-log",
    "dep:nightshade-picking",
    "dep:nightshade-platform",
    "dep:nightshade-prefab",
    "dep:nightshade-render",
    "dep:nightshade-scene",
    "dep:nightshade-shell",
    "dep:nightshade-text",
    "dep:nightshade-ui",
    "dep:nightshade-window",
]
