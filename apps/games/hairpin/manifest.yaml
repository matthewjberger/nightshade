# The packager supplies the activity's `android.app.lib_name` meta-data and its
# launcher intent filter from the package name, so naming them here would put
# each in the manifest twice.
#
# `smallestScreenSize` is worth keeping in `config_changes`. Without it listed,
# the activity is destroyed and rebuilt whenever the smallest screen dimension
# changes rather than being told the size moved.
#
# The theme has to name no action bar. The default theme keeps room for one,
# and the activity reports its content rectangle below it, so the app would
# start a bar's height further down the screen than the system bars need.
android:
  manifest:
    package: com.nightshade.hairpin
    sdk:
      min_sdk_version: 24
      target_sdk_version: 33
    uses_feature:
      - name: android.hardware.vulkan.level
        required: true
        version: 1
    application:
      label: Hairpin
      theme: "@android:style/Theme.NoTitleBar"
      activities:
        - name: android.app.NativeActivity
          exported: true
          orientation: user
          config_changes: "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
