[package]
name = "bulwark"
description = "An isometric tower defense on a hand-laid board of Kenney tiles"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "bulwark-run"
path = "src/main.rs"
required-features = ["plugin"]

[dependencies]
nalgebra-glm = { workspace = true, optional = true }
nightshade = { workspace = true, optional = true }
nightshade-camera = { workspace = true, optional = true }
nightshade-cli = { workspace = true, optional = true }
nightshade-config = { workspace = true, optional = true }
nightshade-graphics = { workspace = true, optional = true }
nightshade-input = { workspace = true, optional = true }
nightshade-log = { workspace = true, optional = true }
nightshade-particles = { workspace = true, optional = true }
nightshade-picking = { workspace = true, optional = true }
nightshade-platform = { workspace = true, optional = true }
nightshade-render = { workspace = true, optional = true }
nightshade-scene = { workspace = true, optional = true }
nightshade-sprite = { workspace = true, optional = true }
nightshade-state = { workspace = true, optional = true }
nightshade-save = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
nightshade-texture = { workspace = true, optional = true }
nightshade-ui = { workspace = true, optional = true }
nightshade-ui-config = { workspace = true, optional = true }
nightshade-ui-menu = { workspace = true, optional = true }
nightshade-waves = { workspace = true, optional = true }
nightshade-wgpu = { workspace = true, features = ["default-plugins"], optional = true }
nightshade-window = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["plugin"]
contract = []
plugin = [
    "contract",
    "dep:nalgebra-glm",
    "dep:nightshade",
    "dep:nightshade-camera",
    "dep:nightshade-cli",
    "dep:nightshade-config",
    "dep:nightshade-graphics",
    "dep:nightshade-input",
    "dep:nightshade-log",
    "dep:nightshade-particles",
    "dep:nightshade-picking",
    "dep:nightshade-platform",
    "dep:nightshade-render",
    "dep:nightshade-scene",
    "dep:nightshade-sprite",
    "dep:nightshade-state",
    "dep:nightshade-save",
    "dep:nightshade-texture",
    "dep:nightshade-ui",
    "dep:nightshade-ui-config",
    "dep:nightshade-ui-menu",
    "dep:nightshade-waves",
    "dep:nightshade-wgpu",
    "dep:nightshade-window",
    "dep:serde",
]
