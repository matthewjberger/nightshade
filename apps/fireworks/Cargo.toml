[package]
name = "fireworks"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { path = "../../crates/nightshade", features = ["tracing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
