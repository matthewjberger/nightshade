[package]
name = "nightshade-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nightshade-window = { path = "../../compose/nightshade-window" }
nightshade-text = { path = "../../describe/nightshade-text", default-features = false, features = ["contract"] }
bytemuck = { workspace = true, features = ["derive"] }
half = { workspace = true }
image = { workspace = true }
naga_oil = { workspace = true }
nalgebra = { workspace = true }
petgraph = { workspace = true }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true, features = ["wgsl", "naga-ir", "dx12", "metal", "vulkan", "webgpu"] }
nalgebra-glm = { workspace = true }
nightshade = { workspace = true }
nightshade-platform = { path = "../../describe/nightshade-platform", default-features = false, features = ["contract"] }
nightshade-ecs = { workspace = true }
nightshade-graphics.workspace = true
nightshade-render = { workspace = true }
tracing = { workspace = true }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DedicatedWorkerGlobalScope",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "ProgressEvent",
    "Url",
    "Window",
] }
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[features]
profiling = ["nightshade-ecs/profiling"]
parallel = ["nightshade-ecs/parallel"]
debug_render = []
default-plugins = ["nightshade-window/default-plugins"]

[package.metadata.cargo-machete]
ignored = ["nalgebra", "nightshade-ecs"]
