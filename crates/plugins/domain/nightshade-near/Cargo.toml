[package]
name = "nightshade-near"
description = "What stands close to a point, answered by a grid the GPU builds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nalgebra-glm = { workspace = true }
nightshade = { workspace = true, optional = true }
nightshade-ecs = { workspace = true }
nightshade-scene = { path = "../../describe/nightshade-scene", default-features = false, features = [
    "contract",
], optional = true }

[features]
default = ["plugin"]
contract = []
plugin = ["contract", "dep:nightshade", "dep:nightshade-scene"]

[lints]
workspace = true
