[package]
name = "nightshade-acoustics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nightshade-scene = { path = "../../describe/nightshade-scene", default-features = false, features = ["contract"] }
nalgebra-glm = { workspace = true, optional = true }
nightshade = { workspace = true, optional = true }
nightshade-ecs = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["plugin"]
contract = ["dep:nalgebra-glm", "dep:nightshade-ecs"]
plugin = ["contract", "dep:nightshade", "dep:tracing"]
