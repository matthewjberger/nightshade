[package]
name = "nightshade-particles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
enum2schema = { workspace = true, optional = true }
nalgebra-glm = { workspace = true, optional = true, features = [
    "serde-serialize",
] }
nightshade = { workspace = true, optional = true }
nightshade-ecs = { workspace = true, optional = true }
nightshade-platform = { path = "../../describe/nightshade-platform", default-features = false, features = ["contract"] }
bytemuck = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["plugin"]
contract = ["dep:enum2schema", "dep:nalgebra-glm", "dep:nightshade-ecs", "dep:serde"]
plugin = [
    "contract",
    "dep:nightshade",
    "dep:bytemuck",
    "dep:tracing",
]

[package.metadata.cargo-machete]
ignored = ["bytemuck", "tracing"]
