[package]
name = "nightshade-voxels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nalgebra-glm = { workspace = true, optional = true }
nightshade = { workspace = true, optional = true }
nightshade-graphics = { path = "../../domain/nightshade-graphics", default-features = false, features = ["contract"], optional = true }
nightshade-platform = { path = "../../describe/nightshade-platform", default-features = false, features = [
    "contract",
], optional = true }
nightshade-render = { workspace = true, optional = true }
nightshade-scene = { path = "../../describe/nightshade-scene", default-features = false, features = [
    "contract",
], optional = true }
nightshade-worker = { workspace = true, optional = true }

[features]
default = ["plugin"]
contract = ["dep:nalgebra-glm"]
plugin = [
    "contract",
    "dep:nightshade",
    "dep:nightshade-graphics",
    "dep:nightshade-platform",
    "dep:nightshade-render",
    "dep:nightshade-scene",
    "dep:nightshade-worker",
]
