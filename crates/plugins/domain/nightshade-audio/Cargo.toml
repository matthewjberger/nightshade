[package]
name = "nightshade-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nightshade-acoustics = { path = "../../domain/nightshade-acoustics", default-features = false, features = ["contract"] }
nightshade-scene = { path = "../../describe/nightshade-scene", default-features = false, features = ["contract"] }
cpal = { workspace = true, optional = true }
enum2schema = { workspace = true, optional = true }
fastrand = { workspace = true, optional = true }
kira = { workspace = true, optional = true }
mint = { workspace = true, optional = true }
nalgebra-glm = { workspace = true, optional = true }
nightshade = { workspace = true, optional = true }
nightshade-load = { workspace = true, optional = true }
nightshade-platform = { path = "../../describe/nightshade-platform", default-features = false, features = ["contract"] }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["plugin"]
contract = ["dep:enum2schema", "dep:serde"]
plugin = [
    "contract",
    "dep:cpal",
    "dep:fastrand",
    "dep:kira",
    "dep:mint",
    "dep:nalgebra-glm",
    "dep:nightshade",
    "dep:nightshade-load",
    "dep:tracing",
]
