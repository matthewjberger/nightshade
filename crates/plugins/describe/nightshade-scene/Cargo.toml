[package]
name = "nightshade-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
enum2schema = { workspace = true }
nalgebra-glm = { workspace = true, features = ["serde-serialize"] }
nightshade-ecs = { workspace = true }
nightshade-platform = { path = "../../describe/nightshade-platform", default-features = false, features = ["contract"] }
nightshade = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["plugin"]
contract = []
plugin = ["contract", "dep:nightshade"]
