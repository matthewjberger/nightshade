[package]
name = "nightshade-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
enum2schema = { version = "0.1.2", features = ["nalgebra-glm"] }
image = { workspace = true }
nalgebra = { workspace = true }
nalgebra-glm = { workspace = true }
nightshade = { workspace = true }
nightshade-scene = { path = "../../describe/nightshade-scene", default-features = false, features = ["contract"] }
ruzstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
basis-universal = { workspace = true }
meshopt = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["nalgebra"]
