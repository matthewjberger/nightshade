[package]
name = "nightshade"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
description = """
A high-performance game engine built on top of freecs ECS with support for Vulkan, WebGPU, and WebGL rendering backends.
"""
homepage = "https://github.com/matthewjberger/nightshade"
repository = "https://github.com/matthewjberger/nightshade"
keywords = ["gamedev", "engine", "ecs", "vulkan", "wgpu"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[features]
default = ["wgpu"]
vulkan = ["dep:ash", "dep:ash-window", "dep:egui-ash-renderer", "dep:gpu-allocator"]
wgpu = ["dep:wgpu", "dep:egui-wgpu", "wgpu/dx12", "wgpu/metal", "wgpu/vulkan"]
webgl = ["dep:wgpu", "dep:egui-wgpu", "wgpu/webgl"]
webgpu = ["dep:wgpu", "dep:egui-wgpu", "wgpu/webgpu"]

[dependencies]
bitflags = { workspace = true }
bytemuck = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
freecs = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
gilrs = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
nalgebra-glm = { workspace = true }
petgraph = { workspace = true }
rand = "0.9"
raw-window-handle = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }
winit = { workspace = true }

ash = { workspace = true, optional = true }
ash-window = { workspace = true, optional = true }
egui-ash-renderer = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
gpu-allocator = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
egui-winit = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
egui-winit = { workspace = true, default-features = false }
futures = "0.3.31"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
