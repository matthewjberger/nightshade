[package]
name = "nightshade-renderer"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
description = "GPU-driven wgpu renderer with a built-in frame graph."
keywords = ["graphics", "rendering", "wgpu", "gamedev"]
categories = ["graphics", "rendering", "game-engines"]

[dependencies]
bytemuck = { workspace = true }
enum2schema = { version = "0.1.2", features = ["nalgebra-glm"] }
raw-window-handle = { workspace = true }
nalgebra = { workspace = true }
nalgebra-glm = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

wgpu = { workspace = true, optional = true }
naga_oil = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

image = { workspace = true, optional = true }
half = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }

egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wgpu = { workspace = true, optional = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[features]
default = ["wgpu"]
rendergraph = ["dep:wgpu", "dep:petgraph", "dep:thiserror"]
wgpu = ["rendergraph", "dep:wgpu", "dep:naga_oil", "dep:cosmic-text", "wgpu/wgsl", "wgpu/naga-ir", "wgpu/dx12", "wgpu/metal", "wgpu/vulkan", "wgpu/webgpu"]
hdr = ["dep:image", "dep:half"]
screenshot = ["dep:image"]
browser_yield = []
debug_render = []
egui = ["dep:egui", "dep:egui-wgpu"]
grass = []
terrain = ["grass"]
