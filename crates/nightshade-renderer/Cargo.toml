[package]
name = "nightshade-renderer"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
description = "GPU-driven wgpu renderer with a built-in frame graph."
keywords = ["graphics", "rendering", "wgpu", "gamedev"]
categories = ["graphics", "rendering", "game-engines"]

[dependencies]
bytemuck = { workspace = true }
enum2schema = { version = "0.1.2", features = ["nalgebra-glm"] }
raw-window-handle = { workspace = true }
nalgebra = { workspace = true }
nalgebra-glm = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

wgpu = { workspace = true, optional = true }
naga_oil = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

image = { workspace = true, optional = true }
half = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }

egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

lz4_flex = { version = "0.13", optional = true }
range-alloc = { version = "0.1", optional = true }
meshopt = { version = "0.6.2", optional = true }
metis = { version = "0.2.2", optional = true }
itertools = { version = "0.14", optional = true }
bitvec = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wgpu = { workspace = true, optional = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster = "0.4"
winit = { workspace = true }

[[example]]
name = "window"
required-features = ["wgpu"]

[[example]]
name = "minimal"
required-features = ["wgpu", "screenshot"]

[[example]]
name = "shapes"
required-features = ["wgpu", "hdr"]

[[example]]
name = "pbr"
required-features = ["wgpu", "hdr"]

[[example]]
name = "decals"
required-features = ["wgpu", "hdr"]

[[example]]
name = "lights"
required-features = ["wgpu", "hdr"]

[[example]]
name = "shadows"
required-features = ["wgpu", "hdr"]

[[example]]
name = "sky"
required-features = ["wgpu", "hdr"]

[[example]]
name = "fog"
required-features = ["wgpu", "hdr"]

[[example]]
name = "transparency"
required-features = ["wgpu", "hdr"]

[[example]]
name = "instancing"
required-features = ["wgpu", "hdr"]

[[example]]
name = "post_processing"
required-features = ["wgpu", "hdr"]

[[example]]
name = "water"
required-features = ["wgpu", "hdr"]

[[example]]
name = "ui"
required-features = ["wgpu", "hdr"]

[[example]]
name = "gpu_particles"
required-features = ["wgpu", "hdr"]

[[example]]
name = "textures"
required-features = ["wgpu", "hdr"]

[[example]]
name = "morph"
required-features = ["wgpu", "hdr"]

[[example]]
name = "vertex_colors"
required-features = ["wgpu", "hdr"]

[[example]]
name = "alpha_mask"
required-features = ["wgpu", "hdr"]

[features]
default = ["wgpu"]
rendergraph = ["dep:wgpu", "dep:petgraph", "dep:thiserror"]
text = ["dep:cosmic-text"]
wgpu = ["rendergraph", "text", "dep:wgpu", "dep:naga_oil", "wgpu/wgsl", "wgpu/naga-ir", "wgpu/dx12", "wgpu/metal", "wgpu/vulkan", "wgpu/webgpu"]
hdr = ["dep:image", "dep:half"]
screenshot = ["dep:image"]
browser_yield = []
debug_render = []
egui = ["dep:egui", "dep:egui-wgpu"]
grass = []
terrain = ["grass"]
meshlet = ["dep:lz4_flex", "dep:range-alloc", "dep:thiserror"]
meshlet_processor = ["meshlet", "dep:meshopt", "dep:metis", "dep:itertools", "dep:bitvec"]
