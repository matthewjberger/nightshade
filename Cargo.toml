[workspace]
members = ["apps/*", "crates/*"]
exclude = ["site", "template", "template_api", "template_leptos", "template_api_leptos", "docs", "apps/editor", "apps/self_assembling", "apps/playground"]
resolver = "2"

[workspace.package]
version = "0.50.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
homepage = "https://github.com/matthewjberger/nightshade"
repository = "https://github.com/matthewjberger/nightshade"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
bincode = "1.3"
bitflags = { version = "2.10.0", features = ["serde"] }
bytemuck = "1.25.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
tracing-web = "0.1"
tracing-tracy = "0.11"
tracing-chrome = "0.7"
arboard = "3"
freecs = { version = "3.19", features = ["dynamic", "snapshot"] }
webbrowser = "1"
gilrs = "0.11.0"
gltf = { version = "1.4.1", features = [
    "KHR_lights_punctual",
    "KHR_materials_unlit",
    "KHR_texture_transform",
    "names",
    "KHR_materials_pbrSpecularGlossiness",
    "KHR_materials_transmission",
    "KHR_materials_volume",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "extensions",
    "import",
    "allow_empty_texture",
] }
cosmic-text = "0.16"
half = "2.7.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
    "gif",
    "webp",
] }
kira = "0.11.0"
mint = "0.5"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
nalgebra-glm = { version = "0.20.0", features = ["convert-bytemuck"] }
nightshade = { version = "0.50.0", path = "crates/nightshade" }
nightshade-api = { version = "0.50.0", path = "crates/nightshade-api" }
nightshade-renderer = { version = "0.50.0", path = "crates/nightshade-renderer", default-features = false }
petgraph = { version = "0.8", features = ["serde-1"] }
rapier3d = { version = "0.30", features = ["debug-render", "serde-serialize"] }
raw-window-handle = "0.6.2"
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
web-time = "1.1.0"
wgpu = { version = "29", default-features = false }
winit = { version = "0.30.13", features = ["serde"] }
accesskit = "0.24"
accesskit_winit = "0.33"
naga_oil = { version = "0.22", default-features = false }
egui = { version = "0.34", default-features = false, features = ["bytemuck", "default_fonts"] }
egui_extras = { version = "0.34", default-features = false, features = ["all_loaders"] }
egui-wgpu = { version = "0.34", default-features = false, features = ["winit"] }
egui-winit = { version = "0.34", default-features = false, features = ["links"] }

clap = { version = "4", features = ["derive"] }
steamworks = "0.13"
steamworks-sys = "0.13"
noise = "0.9"
notify = "7"
ehttp = "0.6"
taffy = "0.7"
ropey = "1.6"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3"
web-sys = "0.3"
leptos = { version = "0.7", features = ["csr"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.dev]
opt-level = 1
debug = false
# debug = "line-tables-only" # use for a speedier build that still has source code lines in stack traces

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
