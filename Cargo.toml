[workspace]
members = [
    "apps/*",
    "crates/ecs/*/components",
    "crates/ecs/*/resources",
    "crates/ecs/*/systems",
    "crates/ecs/*/queries",
    "crates/ecs/*/commands",
    "crates/ecs/*/events",
    "crates/ecs/world",
    "crates/render/*",
    "crates/engine"
]
resolver = "2"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
bitflags = "2.10.0"
bytemuck = "1.24.0"
egui = { version = "0.33.0", default-features = false, features = ["bytemuck", "default_fonts"] }
egui_extras = { version = "0.33.0", default-features = false, features = ["all_loaders"] }
egui-ash-renderer = { version = "0.10.0", default-features = false, features = ["dynamic-rendering", "gpu-allocator"] }
egui-wgpu = { version = "0.33.0", default-features = false, features = ["winit"] }
egui-winit = { version = "0.33.0", default-features = false }
env_logger = "0.11.8"
freecs = "1.3.0"
gilrs = "0.11.0"
gpu-allocator = { version = "0.28.0", features = ["vulkan", "std"], default-features = false }
log = "0.4.28"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
nalgebra-glm = "0.20.0"
petgraph = "0.6"
raw-window-handle = "0.6.2"
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread"] }
web-time = "1.1.0"
wgpu = { version = "27.0.1", default-features = false }
winit = { version = "0.30.12", features = ["serde"] }
