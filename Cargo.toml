[workspace]
members = ["apps/*",  "crates/ecs/world", "crates/ecs/resources/*", "crates/ecs/components/*", "crates/renderer", "crates/engine"]
resolver = "2"
rust-version = "1.90.0"

[workspace.dependencies]
bytemuck = "1.21.0"
egui = "0.33.0"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }
egui-winit = "0.33.0"
env_logger = "0.11.8"
freecs = "1.3.0"
log = "0.4.27"
nalgebra-glm = "0.19.0"
serde = { version = "1.0.219", features = ["derive"] }
winit = { version = "0.30.11", features = ["serde"] }
