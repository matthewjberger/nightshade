[workspace]
members = [
    "apps/book",
    "apps/features/*",
    "apps/games/*",
    "apps/games/blocker/crates/*",
    "apps/games/multiplayer/sandbox",
    "apps/rendering/*",
    "apps/ui/*",
    "apps/viewer",
    "apps/vulkan/*",
    "crates/nightshade",
    "crates/nightshade-ecs",
    "crates/framework/*/*",
    "crates/plugins/*/*",
    "crates/support/*",
    "template",
    "tools/*",
]
exclude = ["apps/games/multiplayer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
homepage = "https://github.com/matthewjberger/nightshade"
repository = "https://github.com/matthewjberger/nightshade"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
arc-swap = "1"
bincode = { version = "2.0", features = ["serde"] }
bytes = "1.4"
clap = { version = "4.6", features = ["derive"] }
enum2contract = "0.3"
fast-surface-nets = "0.2"
postcard = { version = "1.0.4", features = ["alloc", "use-std"] }
smallvec = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", default-features = false }
uuid = { version = "1" }
rayon = "1"
bitflags = { version = "2.13.2", features = ["serde"] }
bytemuck = "1.25.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
tracing-web = "0.1"
tracing-tracy = "0.11"
tracing-chrome = "0.7"
arboard = "3"
nightshade-ecs = { path = "crates/nightshade-ecs" }
webbrowser = "1"
gilrs = "0.11.2"
gltf = { version = "1.4.1", features = [
    "KHR_lights_punctual",
    "KHR_materials_unlit",
    "KHR_texture_transform",
    "names",
    "KHR_materials_pbrSpecularGlossiness",
    "KHR_materials_transmission",
    "KHR_materials_volume",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "extensions",
    "import",
    "allow_empty_texture",
] }
basis-universal = "0.3.1"
cosmic-text = "0.19"
half = "2.7.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
    "gif",
    "webp",
] }
cpal = "0.18.2"
kira = "0.12.4"
ruzstd = "0.9.0"
mint = "0.5"
pollster = "0.4"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
nalgebra-glm = { version = "0.20.0", features = ["convert-bytemuck"] }
nightshade = { path = "crates/nightshade" }
nightshade-acoustics = { path = "crates/plugins/domain/nightshade-acoustics" }
nightshade-animation = { path = "crates/plugins/domain/nightshade-animation" }
nightshade-audio = { path = "crates/plugins/domain/nightshade-audio" }
nightshade-camera = { path = "crates/plugins/domain/nightshade-camera" }
nightshade-camera-controller = { path = "crates/plugins/domain/nightshade-camera-controller" }
nightshade-cli = { path = "crates/plugins/domain/nightshade-cli" }
nightshade-config = { path = "crates/plugins/domain/nightshade-config" }
nightshade-ui-config = { path = "crates/framework/interface/nightshade-ui-config" }
nightshade-ui-nodegraph = { path = "crates/framework/interface/nightshade-ui-nodegraph" }
nightshade-decals = { path = "crates/plugins/domain/nightshade-decals" }
