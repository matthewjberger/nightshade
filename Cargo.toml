[workspace]
members = [
    "apps/*",
    "crates/ecs/*/components",
    "crates/ecs/*/resources",
    "crates/ecs/*/systems",
    "crates/ecs/world",
    "crates/render_vulkan",
    "crates/renderer",
    "crates/engine"
]
resolver = "2"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
bitflags = "2.10.0"
bytemuck = "1.24.0"
egui = "0.33.0"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }
egui-ash-renderer = { version = "0.10.0", default-features = false, features = ["dynamic-rendering", "gpu-allocator"] }
egui-winit = "0.33.0"
env_logger = "0.11.8"
freecs = "1.3.0"
gilrs = "0.11.0"
gpu-allocator = { version = "0.28.0", features = ["vulkan"], default-features = false }
log = "0.4.28"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
nalgebra-glm = "0.20.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
winit = { version = "0.30.12", features = ["serde"] }
