[workspace]
members = [
    "apps/*",
    "crates/*",
]
exclude = [
    "site",
    "template",
]
resolver = "2"

[workspace.package]
version = "0.6.22"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
homepage = "https://github.com/matthewjberger/nightshade"
repository = "https://github.com/matthewjberger/nightshade"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
bitflags = "2.10.0"
bytemuck = "1.24.0"
egui = { version = "0.33.3", default-features = false, features = ["bytemuck", "default_fonts"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["all_loaders"] }
egui-wgpu = { version = "0.33.3", default-features = false, features = ["winit"] }
egui-winit = { version = "0.33.3", default-features = false }
env_logger = "0.11.8"
freecs = "1.3.2"
gilrs = "0.11.0"
gltf = { version = "1.4.1", features = ["KHR_lights_punctual", "names", "KHR_materials_pbrSpecularGlossiness", "import"] }
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
kira = "0.11.0"
log = "0.4.29"
mint = "0.5"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
nalgebra-glm = { version = "0.20.0", features = ["convert-bytemuck"] }
nightshade = { version = "0.6.22", path = "crates/nightshade" }
petgraph = "0.8"
rapier3d = { version = "0.31.0", features = ["debug-render", "serde-serialize"] }
raw-window-handle = "0.6.2"
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
web-time = "1.1.0"
wgpu = { version = "27.0.1", default-features = false }
wgpu-hal = { version = "27.0.4", default-features = false }
winit = { version = "0.30.12", features = ["serde"] }

openxr = { version = "0.19", features = ["static", "loaded"] }
ash = "0.38"
gpu-allocator = "0.28"
clap = { version = "4", features = ["derive"] }
steamworks = "0.12"
steamworks-sys = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
