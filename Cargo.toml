glam = "0.30"
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
meshopt = "0.4"
openxr = { version = "0.21", features = ["static", "loaded"] }
wgpu-hal = { version = "29", features = ["vulkan"] }
raw-window-handle = "0.6.2"
thiserror = "2.0"
enum2schema = { version = "0.1.2", features = ["nalgebra-glm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
