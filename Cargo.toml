[workspace]
members = [
    "apps/editor",
    "crates/*",
]
exclude = [
    "site",
    "template",
]
resolver = "2"

[workspace.package]
version = "0.6.53"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
homepage = "https://github.com/matthewjberger/nightshade"
repository = "https://github.com/matthewjberger/nightshade"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
bincode = "1.3"
bitflags = { version = "2.10.0", features = ["serde"] }
bytemuck = "1.24.0"
egui = { version = "0.33.3", default-features = false, features = ["bytemuck", "default_fonts"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["all_loaders"] }
egui-wgpu = { version = "0.33.3", default-features = false, features = ["winit"] }
egui-winit = { version = "0.33.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-web = "0.1"
tracing-tracy = "0.11"
tracing-chrome = "0.7"
freecs = "1.3.4"
gilrs = "0.11.0"
gltf = { version = "1.4.1", features = [
    "KHR_lights_punctual",
    "names",
    "KHR_materials_pbrSpecularGlossiness",
    "KHR_materials_transmission",
    "KHR_materials_volume",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "import",
] }
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
kira = "0.11.0"
mint = "0.5"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
nalgebra-glm = { version = "0.20.0", features = ["convert-bytemuck"] }
nightshade = { version = "0.6.53", path = "crates/nightshade" }
petgraph = { version = "0.8", features = ["serde-1"] }
rapier3d = { version = "0.30", features = ["debug-render", "serde-serialize"] }
raw-window-handle = "0.6.2"
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
web-time = "1.1.0"
wgpu = { version = "27.0.1", default-features = false }
wgpu-hal = { version = "27.0.0", features = ["vulkan"] }
winit = { version = "0.30.12", features = ["serde"] }

openxr = { version = "0.21", features = ["static", "loaded"] }
ash = "0.38"
gpu-allocator = "0.28"
clap = { version = "4", features = ["derive"] }
steamworks = "0.12"
steamworks-sys = "0.12"
noise = "0.9"
ehttp = "0.6"

# wgpu-hal 27.0.4 has a windows crate version conflict between itself (0.58) and gpu-allocator 0.27 (0.54).
# This patch forces gpu-allocator 0.28 which uses windows 0.58. Remove when wgpu 28 + egui 0.34 are available.
[patch.crates-io]
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator", tag = "0.28.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
